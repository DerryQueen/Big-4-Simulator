<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Big 4 Simulator: Professional Edition</title>
    <style>
        /* --- 1. Global Reset & Modern Light Theme --- */
        :root {
            --bg-color: #F8F9FA;
            --text-color: #333333;
            --accent-blue: #007AFF;
            --accent-red: #FF3B30;
            --accent-green: #34C759;
            --accent-orange: #FF9500;
            --accent-purple: #AF52DE;
            --border-color: #E9ECEF;
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
            --font-main: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 15px;
            letter-spacing: 0.3px;
        }

        /* --- Components --- */

        /* Modal */
        #modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: #FFFFFF;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            width: 360px;
            max-width: 90%;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #1D1D1F;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            background: #F2F2F7;
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            background: #fff;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
        }

        .btn {
            background: var(--accent-blue);
            color: #fff;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .btn-outline:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        /* Layout */
        #app-container {
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            gap: 24px;
            height: 100%;
            padding: 24px;
            max-width: 1440px;
            margin: 0 auto;
            width: 100%;
        }

        @media (max-width: 1024px) {
            #app-container {
                grid-template-columns: 250px 1fr;
            }
            #log-panel {
                display: none; /* Hide log on tablets */
            }
        }

        @media (max-width: 768px) {
            #app-container {
                display: flex;
                flex-direction: column;
                padding: 16px;
                gap: 16px;
            }

            #stats-panel { order: 1; flex: none; }
            #event-panel { order: 2; flex: 1; }
            #log-panel { display: none; }
        }

        .panel {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 18px;
            box-shadow: var(--card-shadow);
            padding: 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Stats Panel */
        #stats-panel { gap: 20px; }

        .profile-header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .user-name { font-size: 20px; font-weight: 700; color: #1D1D1F; }
        .user-title { font-size: 14px; color: #86868B; margin-top: 4px; font-weight: 500; }
        .user-time {
            display: inline-block;
            margin-top: 8px;
            background: #F2F2F7;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #555;
        }

        .metric-group { display: flex; flex-direction: column; gap: 12px; }

        .metric { display: flex; flex-direction: column; gap: 6px; }

        .metric-top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; color: #666; }

        .progress-track { height: 10px; background: #F2F2F7; border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 5px; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }

        .fill-energy { background: linear-gradient(90deg, #34C759, #30B0C7); }
        .fill-money { background: linear-gradient(90deg, #FF9500, #FFCC00); }
        .fill-stress { background: linear-gradient(90deg, #FF3B30, #FF2D55); }
        .fill-conn { background: linear-gradient(90deg, #007AFF, #5856D6); }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            color: #86868B;
            font-weight: 700;
            letter-spacing: 1px;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .tag-container { display: flex; flex-wrap: wrap; gap: 8px; }

        .tag {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .tag-buff { background: rgba(52, 199, 89, 0.1); color: #34C759; border: 1px solid rgba(52, 199, 89, 0.2); }
        .tag-achieve { background: rgba(175, 82, 222, 0.1); color: #AF52DE; border: 1px solid rgba(175, 82, 222, 0.2); }

        /* Event Panel */
        #event-panel { justify-content: space-between; position: relative; }

        .event-badge {
            align-self: center;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        .badge-work { background: #E8F2FF; color: #007AFF; }
        .badge-life { background: #FFF4E5; color: #FF9500; }

        #event-content {
            flex: 1;
            font-size: 18px;
            line-height: 1.7;
            color: #1D1D1F;
            overflow-y: auto;
            margin-bottom: 30px;
            white-space: pre-wrap;
        }

        .cursor::after {
            content: '';
            display: inline-block;
            width: 2px;
            height: 18px;
            background: var(--accent-blue);
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .choices { display: flex; flex-direction: column; gap: 12px; }

        .choice-card {
            background: #FAFAFA;
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 14px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .choice-card:hover {
            border-color: var(--accent-blue);
            background: #fff;
            box-shadow: 0 8px 20px rgba(0, 122, 255, 0.12);
            transform: translateY(-2px);
        }

        .choice-card:active { transform: translateY(0); }

        .choice-label { font-size: 15px; font-weight: 600; color: #1D1D1F; }

        /* Log Panel */
        #log-panel { background: #FBFBFD; }

        .log-list {
            display: flex; flex-direction: column; gap: 16px; overflow-y: auto; flex: 1; padding-right: 4px;
        }

        .log-item {
            font-size: 13px;
            line-height: 1.5;
            color: #424245;
            padding-bottom: 12px;
            border-bottom: 1px solid #F2F2F7;
        }

        .log-meta { font-size: 11px; color: #86868B; margin-bottom: 4px; font-weight: 500; }

        /* Report Overlay Extra Styles */
        .report-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            text-align: left;
            margin: 30px 0;
        }

        .report-val { font-size: 24px; font-weight: 700; }
        .text-green { color: var(--accent-green); }
        .text-red { color: var(--accent-red); }

    </style>
</head>
<body>

    <!-- Init Modal -->
    <div id="modal-overlay">
        <div class="modal-card" id="login-card">
            <div class="modal-title">Big 4 Simulator</div>
            <p style="color:#666; margin-bottom:20px; font-size:14px;">请输入你的英文名 (First Name)</p>
            <input type="text" id="username" placeholder="e.g. David, Jessica" maxlength="12">
            <button class="btn" id="btn-start">入职 (Onboard)</button>
        </div>

        <div class="modal-card" id="report-card" style="display:none;">
            <div class="modal-title">Year End Review</div>
            <div id="report-content"></div>
            <button class="btn" id="btn-next-year">开启下一年</button>
        </div>
    </div>

    <div id="app-container">

        <!-- Left: Status -->
        <aside id="stats-panel" class="panel">
            <div class="profile-header">
                <div class="user-name" id="disp-name">Guest</div>
                <div class="user-title" id="disp-title">Audit Associate 1</div>
                <div class="user-time" id="disp-time">Y1 Q1</div>
            </div>

            <div class="metric-group">
                <div class="metric">
                    <div class="metric-top"><span>精力 (Energy)</span><span id="val-energy">100</span></div>
                    <div class="progress-track"><div class="progress-fill fill-energy" id="bar-energy" style="width:100%"></div></div>
                </div>
                <div class="metric">
                    <div class="metric-top"><span>财富 (Money)</span><span id="val-money">0.8w</span></div>
                    <div class="progress-track"><div class="progress-fill fill-money" id="bar-money" style="width:10%"></div></div>
                </div>
                <div class="metric">
                    <div class="metric-top"><span>压力 (Stress)</span><span id="val-stress">50</span></div>
                    <div class="progress-track"><div class="progress-fill fill-stress" id="bar-stress" style="width:50%"></div></div>
                </div>
                <div class="metric">
                    <div class="metric-top"><span>人脉 (Connection)</span><span id="val-conn">0</span></div>
                    <div class="progress-track"><div class="progress-fill fill-conn" id="bar-conn" style="width:0%"></div></div>
                </div>
            </div>

            <div>
                <div class="section-title">ACTIVE BUFFS</div>
                <div class="tag-container" id="buff-container">
                    <!-- <span class="tag tag-buff">Coffee High</span> -->
                    <span style="color:#ccc; font-size:12px;">暂无状态</span>
                </div>
            </div>

            <div>
                <div class="section-title">ACHIEVEMENTS</div>
                <div class="tag-container" id="achieve-container">
                    <!-- <span class="tag tag-achieve">First OT</span> -->
                    <span style="color:#ccc; font-size:12px;">虚位以待</span>
                </div>
            </div>
        </aside>

        <!-- Center: Event -->
        <main id="event-panel" class="panel">
            <div class="event-badge badge-work" id="event-type">WORK EVENT</div>
            <div id="event-content">正在加载资源...</div>
            <div class="choices" id="choices-area">
                <!-- Choices -->
            </div>
        </main>

        <!-- Right: Log -->
        <aside id="log-panel" class="panel">
            <div class="section-title" style="margin-top:0;">CAREER LOG</div>
            <div class="log-list" id="log-list">
                <!-- Logs -->
            </div>
        </aside>

    </div>

    <script>
        // --- DATA CONSTANTS ---
        const RANKS = ['A1', 'A2', 'S1', 'S2', 'S3', 'M1', 'M2', 'SM', 'Par'];
        // Salary in 'Wan' (Monthly * 3 for Quarter)
        const SALARY = [2.4, 3.0, 4.5, 5.4, 6.0, 9.0, 10.5, 15.0, 30.0];

        // --- CONTENT POOL ---
        const EVENTS = [
            // --- A-Level (0-1) ---
            { id: 1, type: 'work', min: 0, max: 1, text: "入职第一周，Manager 让你去打印室把 50 本报告装订好，但打印机突然卡纸了，墨粉洒了一地。", choices: [
                { label: "自己动手修，弄得满身黑", effect: { e: -10, m: 0, s: 5, c: 0, p: 2 }, log: "修好了打印机，Manager 夸你'Handy'，但衬衫报废了。" },
                { label: "找 Admin 姐姐帮忙", effect: { e: 0, m: -0.05, s: -5, c: 2, p: 0 }, log: "请 Admin 喝了杯喜茶，建立了良好的行政关系。" }
            ]},
            { id: 2, type: 'work', min: 0, max: 2, text: "每个月的报销日到了。看着面前堆积如山的打车票和粘稠的胶水，你感到一阵恶心。", choices: [
                { label: "强迫症发作，整整齐齐贴好", effect: { e: -5, m: 0, s: -5, c: 0, p: 2 }, log: "财务部夸你是'贴票模范'，但你浪费了整整一下午。" },
                { label: "大概齐粘一下", effect: { e: 0, m: 0, s: 5, c: 0, p: -5 }, log: "财务把报销单退回来了：'遮挡了二维码'。你心态崩了。" }
            ]},
            { id: 3, type: 'work', min: 0, max: 2, text: "在客户现场抽凭（Vouching），但客户的财务大姐心情不好，故意把仓库钥匙拿走了。", choices: [
                { label: "买杯星巴克去哄大姐", effect: { e: 0, m: -0.04, s: -5, c: 5, p: 5 }, log: "大姐喜笑颜开，不仅给了钥匙，还给了你一包瓜子。" },
                { label: "向 Manager 打小报告", effect: { e: 0, m: 0, s: 5, c: -5, p: -5 }, log: "Manager 觉得你连这点小事都搞不定（Soft skill 差）。" }
            ]},
            { id: 4, type: 'work', min: 0, max: 3, text: "你的 Excel 突然未响应（Not Responding），上一次保存是 3 小时前。", choices: [
                { label: "绝望地等待它恢复", effect: { e: 0, m: 0, s: -15, c: 0, p: 0 }, log: "奇迹发生了！它恢复了！虽然你吓出了一身冷汗。" },
                { label: "强制关闭重做", effect: { e: -10, m: 0, s: -5, c: 0, p: 5 }, log: "你凭记忆重做了一遍，手速快到残影。" }
            ]},
            { id: 5, type: 'work', min: 0, max: 2, text: "半夜 2 点，Senior 让你别填 OT（加班费），说是项目预算爆了（Over-run）。", choices: [
                { label: "老实听话，只填 8 小时", effect: { e: 0, m: -0.2, s: -5, c: 5, p: 5 }, log: "牺牲了自己的钱包，但 Senior 觉得你'懂事'。" },
                { label: "头铁，据实申报", effect: { e: 0, m: 0.2, s: 5, c: -5, p: -5 }, log: "拿到了加班费，但被 Manager 标记为'缺乏 Big Picture'。" }
            ]},
            // --- S-Level (2-4) ---
            { id: 10, type: 'work', min: 2, max: 4, text: "你带的 A1 在客户现场突然破防大哭，说这活儿没法干了。", choices: [
                { label: "温柔安抚并代领工作", effect: { e: -20, m: 0, s: -5, c: 10, p: 0 }, log: "你是神仙 Senior，自己通宵填坑，小朋友把你当再生父母。" },
                { label: "严厉批评并上报 Manager", effect: { e: 0, m: 0, s: 5, c: -10, p: 5 }, log: "小朋友直接旷工了，Manager 质疑你的带队能力（Coaching skill）。" }
            ]},
            { id: 11, type: 'work', min: 2, max: 4, text: "客户的 FC（财务总监）是个暴脾气，因为你发了太多 PBC List，他在会议室摔了文件夹。", choices: [
                { label: "卑微道歉，陪笑脸", effect: { e: 0, m: 0, s: -15, c: 0, p: 5 }, log: "自尊心受挫，但拿到了资料。" },
                { label: "据理力争，这是审计程序", effect: { e: 0, m: 0, s: 10, c: -10, p: -10 }, log: "FC 向 Partner 投诉你态度恶劣，你被挂了 Review Note。" }
            ]},
            { id: 12, type: 'work', min: 2, max: 5, text: "猎头神秘兮兮地联系你：某互联网大厂战略岗，薪资涨幅 50%，但这周要面试。", choices: [
                { label: "请病假（MC）去面试", effect: { e: 5, m: 0, s: 10, c: 0, p: -15 }, log: "面试感觉不错，但你的项目进度落下了一大截。" },
                { label: "拒绝诱惑，我要做合伙人", effect: { e: -5, m: 0, s: -5, c: 0, p: 10 }, log: "你挂了电话，继续在 Excel 里调平报表。你是卷王之王！" }
            ]},
            { id: 13, type: 'work', min: 3, max: 5, text: "Manager 突然离职去了甲方，留下一个烂摊子项目，上面让你暂代 Site In-charge。", choices: [
                { label: "硬着头皮顶上", effect: { e: -15, m: 0, s: -10, c: 5, p: 20 }, log: "每天睡 3 小时，成功填坑。Partner 记住了你的名字。" },
                { label: "表示能力不足，请求支援", effect: { e: 5, m: 0, s: 5, c: -5, p: -10 }, log: "上面派了别的经理来，你轻松了，但晋升机会也没了。" }
            ]},
            // --- M-Level+ (5-8) ---
            { id: 20, type: 'work', min: 5, max: 8, text: "你在研究“八字”命理时，发现合伙人最近正处于“岁运并临”。", choices: [
                { label: "以此为切入点找他闲聊", effect: { e: 0, m: 0, s: 5, c: 15, p: 0 }, log: "Partner 觉得你是知音，拉着你聊了一下午玄学，关系拉近了。" },
                { label: "保持专业，守口如瓶", effect: { e: 0, m: 0, s: 0, c: 0, p: 5 }, log: "你选择靠专业能力说话，虽然稳妥但没能留下深刻印象。" }
            ]},
            { id: 21, type: 'work', min: 5, max: 8, text: "合伙人让你去 BD（拓展业务）一个潜在的大客户，但对方暗示需要一点'回扣'。", choices: [
                { label: "严词拒绝，坚守合规", effect: { e: 0, m: 0, s: 5, c: 0, p: 0 }, log: "单子丢了，Partner 脸色很难看，但你守住了红线。" },
                { label: "含糊其辞，先拖着", effect: { e: -5, m: 0, s: -10, c: 5, p: 5 }, log: "你用太极推手周旋，最后靠专业能力折服了对方（没给钱）。" }
            ]},
            { id: 22, type: 'work', min: 6, max: 8, text: "你是 Senior Manager，Partner 让你帮忙'优化'掉一个刚怀孕的高级审计员（Counselling out）。", choices: [
                { label: "执行命令，做个冷酷杀手", effect: { e: 0, m: 0, s: -20, c: 5, p: 5 }, log: "你完成了任务，Partner 夸你有'管理者的决断'，但你觉得自己是个混蛋。" },
                { label: "据理力争，保下她", effect: { e: 0, m: 0, s: 10, c: -10, p: -10 }, log: "你保住了她，但 Partner 觉得你'太软弱'（Too nice）。" }
            ]},
            { id: 23, type: 'work', min: 5, max: 8, text: "为了拿下大客户，Partner 让你去陪客户喝茅台，你不胜酒力。", choices: [
                { label: "舍命陪君子，干了！", effect: { e: -20, m: 0, s: -5, c: 10, p: 10 }, log: "你在厕所吐了一晚，但客户签单了。你的肝在隐隐作痛。" },
                { label: "偷偷把酒换成水", effect: { e: 0, m: 0, s: 5, c: -5, p: 0 }, log: "客户看破没说破，场面一度很尴尬。" }
            ]},
            // --- Life Events (All Ranks) ---
            { id: 101, type: 'life', min: 0, max: 8, text: "连轴转了三周，周末你决定给自己做顿丰盛的晚餐，并练习了半小时的拉伸。", choices: [
                { label: "彻底放松", effect: { e: 10, m: -0.05, s: -15, c: 0, p: 0 }, log: "久违的烟火气让你找回了生活的感觉（Work-Life Balance Get）。" },
                { label: "边吃边看 Outlook", effect: { e: -5, m: 0, s: 5, c: 0, p: 2 }, log: "饭凉了，但你回了 10 封邮件，这就是四大人的宿命。" }
            ]},
            { id: 102, type: 'life', min: 0, max: 5, text: "今天是恋爱纪念日，但这周正好是 IPO Filing（申报），全组都在打印室通宵。", choices: [
                { label: "溜出去吃个饭再回来", effect: { e: 5, m: -0.1, s: 10, c: 0, p: -10 }, log: "对象很开心，但你回来时发现 Partner 正在找你，你的电话没接。" },
                { label: "发个大红包，继续加班", effect: { e: -5, m: -0.2, s: -20, c: 0, p: 5 }, log: "保住了项目进度，但收到了一条分手短信：'你和底稿过一辈子吧'。" }
            ]},
            { id: 103, type: 'life', min: 0, max: 8, text: "忙季打不到车，暴雨如注。你看到了昂贵的“极氪专车”。", choices: [
                { label: "对自己好点，坐专车", effect: { e: 10, m: -0.08, s: -5, c: 0, p: 0 }, log: "钱包流血，但你在后座睡了个好觉，回血成功。" },
                { label: "坚持排队等快车", effect: { e: -10, m: 0, s: 10, c: 0, p: 0 }, log: "在寒风中站了 40 分钟，感觉又要感冒了。" }
            ]},
            { id: 104, type: 'life', min: 0, max: 8, text: "你在茶水间听到 Manager 的八卦，似乎是关于办公室恋情的。", choices: [
                { label: "加入讨论并贡献内幕", effect: { e: 0, m: 0, s: -10, c: 5, p: 0 }, log: "八卦是压力的润滑剂。你和同事的关系拉近了。" },
                { label: "默默走开", effect: { e: 0, m: 0, s: 0, c: 0, p: 0 }, log: "你保持了清高，但也错过了融入小团体的机会。" }
            ]},
            { id: 105, type: 'life', min: 0, max: 8, text: "半夜 3 点底稿崩溃，你感到心脏狂跳。", choices: [
                { label: "地毯冥想 + 拉伸", effect: { e: 5, m: 0, s: -5, c: 0, p: 0 }, log: "你在满是灰尘的地毯上做了个 Downward Dog，Sanity 回归。" },
                { label: "去楼下便利店买关东煮", effect: { e: 5, m: -0.02, s: -5, c: 0, p: 0 }, log: "热汤下肚，感觉又活过来了。" }
            ]},
            { id: 106, type: 'life', min: 0, max: 8, text: "房东突然打电话说要涨房租 20%，因为这地段离公司近。", choices: [
                { label: "含泪接受，搬家太累", effect: { e: 0, m: -0.5, s: -5, c: 0, p: 0 }, log: "你的固定支出增加了，存钱变得更难了。" },
                { label: "果断搬家，住远点", effect: { e: -10, m: 0, s: 10, c: 0, p: 0 }, log: "通勤时间变长了，每天要在地铁上挤一小时，精力消耗加剧。" }
            ]},
            { id: 107, type: 'life', min: 0, max: 8, text: "你报名了半程马拉松，但最近一直在加班。", choices: [
                { label: "逼自己去训练", effect: { e: -10, m: 0, s: -10, c: 0, p: 0 }, buff: {id:'runner', name:'Runner High', turn:4, desc:'精力上限提升'}, log: "身体极度疲惫，但精神得到了升华。获得 Buff：Runner High。" },
                { label: "弃赛，睡觉要紧", effect: { e: 5, m: 0, s: 0, c: 0, p: 0 }, log: "你选择补觉，报名费打水漂了。" }
            ]}
        ];

        // --- GAME STATE ---
        const gameState = {
            name: "Audit Dog",
            year: 1,
            quarter: 1,
            levelIndex: 0,
            stats: {
                energy: 100,
                money: 0.8,
                stress: 50,
                connection: 0,
                performance: 50
            },
            moneyStartYear: 0.8,
            buffs: [], // {id, name, turn, desc}
            achievements: new Set(),
            log: []
        };

        // --- DOM REFERENCES ---
        const $ = (id) => document.getElementById(id);
        const els = {
            modal: $('modal-overlay'),
            loginCard: $('login-card'),
            reportCard: $('report-card'),
            userIn: $('username'),
            btnStart: $('btn-start'),
            btnNextYear: $('btn-next-year'),

            // Stats
            dispName: $('disp-name'),
            dispTitle: $('disp-title'),
            dispTime: $('disp-time'),
            valEnergy: $('val-energy'), barEnergy: $('bar-energy'),
            valMoney: $('val-money'), barMoney: $('bar-money'),
            valStress: $('val-stress'), barStress: $('bar-stress'),
            valConn: $('val-conn'), barConn: $('bar-conn'),
            buffs: $('buff-container'),
            achieves: $('achieve-container'),

            // Event
            eventType: $('event-type'),
            eventContent: $('event-content'),
            choices: $('choices-area'),

            // Log
            logList: $('log-list'),
            reportContent: $('report-content')
        };

        // --- INITIALIZATION ---
        els.btnStart.onclick = () => {
            const name = els.userIn.value.trim();
            if(!name) return;
            gameState.name = name;
            els.loginCard.style.display = 'none';
            els.modal.style.display = 'none';
            initGame();
        };

        function initGame() {
            gameState.moneyStartYear = gameState.stats.money;
            renderUI();
            addLog("System", "Welcome to the Firm. 入职快乐。");
            setTimeout(triggerQuarterStart, 500);
        }

        // --- CORE LOGIC ---

        function triggerQuarterStart() {
            // Check Game Over or Year End
            if (gameState.quarter > 4) {
                showYearEnd();
                return;
            }

            // Salary
            const salary = SALARY[gameState.levelIndex];
            changeStat('money', salary);

            // Process Buffs
            processBuffs();

            // Render
            renderUI();

            // Work Event
            const event = pickEvent('work');
            renderEvent(event);
        }

        function triggerLifeCheck() {
            // 40% chance for life event between quarters
            const roll = Math.random();
            if (roll < 0.4) {
                const event = pickEvent('life');
                renderEvent(event);
            } else {
                nextQuarter();
            }
        }

        function nextQuarter() {
            gameState.quarter++;
            triggerQuarterStart();
        }

        function pickEvent(type) {
            const pool = EVENTS.filter(e => e.type === type && gameState.levelIndex >= e.min && gameState.levelIndex <= e.max);
            if (pool.length === 0) {
                // Fallback
                return {
                    id: 999, type: type, text: type === 'work' ? "这个季度平平无奇，除了无穷无尽的底稿。" : "这个周末你只想躺在床上刷手机，什么都没发生。",
                    choices: [{ label: "继续生活", effect: {}, log: "时间继续流动。" }]
                };
            }
            return pool[Math.floor(Math.random() * pool.length)];
        }

        function renderEvent(event) {
            els.eventType.textContent = event.type === 'work' ? 'WORK EVENT (职场)' : 'LIFE EVENT (生活)';
            els.eventType.className = event.type === 'work' ? 'event-badge badge-work' : 'event-badge badge-life';

            typeText(event.text, () => {
                els.choices.innerHTML = '';
                event.choices.forEach(c => {
                    const card = document.createElement('div');
                    card.className = 'choice-card';
                    card.innerHTML = `<div class="choice-label">${c.label}</div>`;
                    card.onclick = () => handleChoice(c, event.type);
                    els.choices.appendChild(card);
                });
            });
        }

        function handleChoice(c, type) {
            // Apply Stats
            if(c.effect.e) changeStat('energy', c.effect.e);
            if(c.effect.m) changeStat('money', c.effect.m);
            if(c.effect.s) changeStat('stress', c.effect.s);
            if(c.effect.c) changeStat('connection', c.effect.c);
            if(c.effect.p) changeStat('performance', c.effect.p);

            // Apply Buffs
            if(c.buff) {
                gameState.buffs.push({...c.buff});
                addLog("Buff", `获得了状态: ${c.buff.name}`);
            }

            // Check Achievements
            checkAchievements(c);

            addLog(type === 'work' ? 'Decision' : 'Life', c.log);
            renderUI();

            // Check Death
            const death = checkGameOver();
            if(death) {
                els.eventContent.innerHTML = `<span style="color:red; font-weight:bold;">${death}</span>`;
                els.choices.innerHTML = `<div class="choice-card" onclick="location.reload()"><div class="choice-label">重新开始 (Restart)</div></div>`;
                return;
            }

            // Transition
            els.choices.innerHTML = '';
            const btn = document.createElement('div');
            btn.className = 'choice-card';
            btn.style.textAlign = 'center';
            btn.innerHTML = `<div class="choice-label" style="color:var(--accent-blue)">继续 (Continue) -></div>`;

            if (type === 'work') {
                btn.onclick = triggerLifeCheck;
            } else {
                btn.onclick = nextQuarter;
            }
            els.choices.appendChild(btn);
        }

        // --- HELPERS ---

        function changeStat(key, delta) {
            // Apply Buffs logic could go here (e.g. reduce energy loss)
            // Simpler: Just raw apply for now
            gameState.stats[key] += delta;

            // Bounds
            if(key === 'energy') gameState.stats[key] = Math.max(0, Math.min(100, gameState.stats[key]));
            if(key === 'stress') gameState.stats[key] = Math.max(0, Math.min(100, gameState.stats[key]));
            if(key === 'connection') gameState.stats[key] = Math.max(0, Math.min(100, gameState.stats[key]));
            if(key === 'performance') gameState.stats[key] = Math.max(0, Math.min(100, gameState.stats[key]));
        }

        function processBuffs() {
            // Decrease duration
            gameState.buffs.forEach(b => b.turn--);
            const expired = gameState.buffs.filter(b => b.turn <= 0);
            if (expired.length > 0) {
                expired.forEach(b => addLog("System", `状态失效: ${b.name}`));
            }
            gameState.buffs = gameState.buffs.filter(b => b.turn > 0);
        }

        function checkAchievements(c) {
            // Simple logic: Trigger based on specific flags or stat thresholds
            if (gameState.stats.money > 50 && !gameState.achievements.has('First Pot of Gold')) {
                unlockAchievement('First Pot of Gold', '存款突破 50w');
            }
            if (gameState.stats.stress > 90 && !gameState.achievements.has('On The Edge')) {
                unlockAchievement('On The Edge', '压力爆表边缘');
            }
            // Add more specific ones based on choice ID if needed
        }

        function unlockAchievement(id, desc) {
            gameState.achievements.add(id);
            addLog("Achievement", `解锁成就: ${desc}`);
        }

        function checkGameOver() {
            const s = gameState.stats;
            if(s.energy <= 0) return "Game Over: 身体垮了 (Karoshi)。ICU 费用花光了你的积蓄。";
            if(s.money < 0) return "Game Over: 破产 (Bankrupt)。信用卡逾期，你被列入失信名单。";
            if(s.stress >= 100) return "Game Over: 精神崩溃 (Burnout)。你在客户现场大喊大叫，被保安架走。";
            if(s.stress <= 0) return "Game Over: 彻底躺平 (Lying Flat)。Manager 觉得你毫无斗志，劝退了你。";
            return null;
        }

        // --- UI RENDER ---

        function renderUI() {
            // Header
            els.dispName.textContent = gameState.name;
            els.dispTitle.textContent = RANKS[gameState.levelIndex];
            els.dispTime.textContent = `Year ${gameState.year} Q${gameState.quarter <= 4 ? gameState.quarter : 'End'}`;

            // Stats
            updateBar('energy', 'fill-energy');
            updateBar('money', 'fill-money', 100); // 100w as visual cap
            updateBar('stress', 'fill-stress');
            updateBar('conn', 'fill-conn');

            // Buffs
            els.buffs.innerHTML = gameState.buffs.length ?
                gameState.buffs.map(b => `<span class="tag tag-buff">${b.name} (${b.turn})</span>`).join('') :
                `<span style="color:#ccc; font-size:12px;">暂无状态</span>`;

            // Achievements
            els.achieves.innerHTML = gameState.achievements.size ?
                Array.from(gameState.achievements).map(a => `<span class="tag tag-achieve">${a}</span>`).join('') :
                `<span style="color:#ccc; font-size:12px;">虚位以待</span>`;
        }

        function updateBar(key, fillClass, max=100) {
            const val = gameState.stats[key === 'conn' ? 'connection' : key];
            const pct = Math.max(0, Math.min(100, (val / max) * 100));
            $(`val-${key}`).textContent = key === 'money' ? val.toFixed(2) + 'w' : val;
            $(`bar-${key}`).style.width = `${pct}%`;
        }

        function addLog(source, text) {
            const item = document.createElement('div');
            item.className = 'log-item';
            item.innerHTML = `<div class="log-meta">Y${gameState.year} Q${gameState.quarter <= 4 ? gameState.quarter : 4} • ${source}</div><div>${text}</div>`;
            els.logList.prepend(item);
        }

        // Typewriter
        let typeTimer;
        function typeText(text, cb) {
            els.eventContent.innerHTML = '';
            els.eventContent.classList.add('cursor');
            let i = 0;
            clearInterval(typeTimer);
            typeTimer = setInterval(() => {
                els.eventContent.textContent += text.charAt(i);
                i++;
                if(i >= text.length) {
                    clearInterval(typeTimer);
                    els.eventContent.classList.remove('cursor');
                    if(cb) cb();
                }
            }, 15);
        }

        // --- YEAR END ---
        function showYearEnd() {
            const p = gameState.stats.performance;
            const c = gameState.stats.connection;
            let title = "STAY (留任)";
            let desc = "表现平平（Meets Expectation），继续搬砖。";
            let promo = false;

            if (p < 40) {
                title = "COUNSELLED OUT (劝退)";
                desc = "绩效垫底，Manager 建议你看看外面的机会。Game Over。";
            } else if (p > 80) {
                // Partner check
                if (gameState.levelIndex === 7) { // SM -> Par
                    if (c >= 80) {
                        title = "PARTNER (合伙人)";
                        desc = "恭喜登顶！你成为了 Firm 的主人。";
                        promo = true;
                    } else {
                        desc = "绩效完美，但人脉不足（Connection < 80）。合伙人投票没过。";
                    }
                } else {
                    title = `PROMOTED (晋升)`;
                    desc = `恭喜晋升为 ${RANKS[gameState.levelIndex + 1]}！`;
                    promo = true;
                }
            }

            const wDelta = gameState.stats.money - gameState.moneyStartYear;

            els.reportContent.innerHTML = `
                <div class="report-grid">
                    <div>
                        <div style="font-size:12px; color:#888;">绩效评分</div>
                        <div class="report-val ${p>80?'text-green':'text-red'}">${p}</div>
                    </div>
                    <div>
                        <div style="font-size:12px; color:#888;">财富增量</div>
                        <div class="report-val text-green">+${wDelta.toFixed(2)}w</div>
                    </div>
                </div>
                <div style="background:#F2F2F7; padding:15px; border-radius:10px; margin-bottom:20px;">
                    <div style="color:${promo?'#34C759':'#1D1D1F'}; font-weight:700; margin-bottom:5px;">${title}</div>
                    <div style="font-size:14px; color:#666;">${desc}</div>
                </div>
            `;

            if (title.includes("劝退")) {
                els.btnNextYear.textContent = "Game Over (Restart)";
                els.btnNextYear.onclick = () => location.reload();
            } else if (title.includes("PARTNER")) {
                els.btnNextYear.textContent = "Victory (Restart)";
                els.btnNextYear.onclick = () => location.reload();
            } else {
                els.btnNextYear.textContent = "Start Next Year";
                els.btnNextYear.onclick = () => {
                    els.modal.style.display = 'none';
                    els.reportCard.style.display = 'none';
                    // Apply changes
                    if(promo) gameState.levelIndex++;
                    gameState.year++;
                    gameState.quarter = 1;
                    gameState.stats.performance = 50;
                    changeStat('energy', 20);
                    changeStat('stress', -20);
                    gameState.moneyStartYear = gameState.stats.money;

                    addLog("System", `Year ${gameState.year} Started.`);
                    triggerQuarterStart();
                };
            }

            els.loginCard.style.display = 'none';
            els.reportCard.style.display = 'block';
            els.modal.style.display = 'flex';
        }

    </script>
</body>
</html>
