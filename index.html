<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Big 4 Survival</title>
    <style>
        /* Minimalist Dark Mode Theme */
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent-color: #333333;
            --border-color: #ffffff;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Prevent body scroll, handle inside main */
        }

        /* Header: Status Bar */
        #status-bar {
            padding: 15px;
            border-bottom: 2px solid var(--border-color);
            background-color: var(--bg-color);
            z-index: 10;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 1rem;
            font-weight: bold;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        /* Main: Game Log */
        #game-log {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            scroll-behavior: smooth;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        #game-log p {
            margin-bottom: 12px;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Footer: Controls */
        #controls {
            padding: 20px;
            border-top: 2px solid var(--border-color);
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            gap: 15px; /* Spacing between buttons */
        }

        button {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 2px solid var(--border-color);
            padding: 18px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%; /* Full width for easy tapping */
            transition: background-color 0.2s, color 0.2s;
            text-align: center;
        }

        button:active {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #555;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }

    </style>
</head>
<body>

    <header id="status-bar">
        <div class="status-row">
            <span id="year-display">Year 1</span>
            <span id="quarter-display">Q1/4</span>
        </div>
        <div class="status-row">
            <span id="level-display">Audit Associate 1</span>
        </div>
        <div class="stats-row">
            <span>HP: <span id="hp-val">100</span></span>
            <span>SAN: <span id="san-val">100</span></span>
            <span>KPI: <span id="kpi-val">50</span></span>
        </div>
    </header>

    <main id="game-log">
        <!-- Text will be appended here -->
    </main>

    <footer id="controls">
        <!-- Buttons will be injected here -->
    </footer>

    <script>
        // --- Game Constants ---
        const CAREER_LADDER = [
            'Audit Associate 1 (A1)',
            'Audit Associate 2 (A2)',
            'Senior Associate 1 (S1)',
            'Senior Associate 2 (S2)',
            'Senior Associate 3 (S3)',
            'Manager 1 (M1)',
            'Manager 2 (M2)',
            'Senior Manager (SM)',
            'Partner (Par)'
        ];

        // --- Game State ---
        const gameState = {
            year: 1,
            quarter: 1, // 1-4 representing Q1-Q4
            levelIndex: 0, // Points to CAREER_LADDER index
            stats: {
                health: 100,
                sanity: 100,
                performance: 50
            }
        };

        // --- Game Data ---
        const gameEvents = [
            {
                id: 1,
                text: "【凌晨加班】凌晨 2 点，手机突然震动。Manager 发来了 Review Note，并留言：“这些问题很急，明早 8 点前我要看到修改后的版本。”",
                choices: [
                    {
                        label: "立刻通宵修改",
                        effect: { health: -15, sanity: -5, performance: 10 },
                        log: "你灌了一杯浓缩咖啡，通宵达旦地改完了所有问题。Manager 很满意，但你的心脏隐隐作痛。"
                    },
                    {
                        label: "假装睡着没看见",
                        effect: { health: 5, sanity: 5, performance: -15 },
                        log: "你把手机关机，倒头就睡。第二天早上被 Manager 当众痛批，KPI 受到重创，但你精神饱满。"
                    },
                    {
                        label: "只改关键点，其他的糊弄一下",
                        effect: { health: -5, sanity: -2, performance: 0 },
                        log: "你花了一小时改了重点。Manager 觉得你态度一般，但也没说什么，勉強过关。"
                    }
                ]
            },
            {
                id: 2,
                text: "【抽凭噩梦】你在抽查凭证时发现，客户提供的发票不仅编号不连续，仔细一看，甚至有几张是明显的假发票。",
                choices: [
                    {
                        label: "立刻上报 Senior",
                        effect: { health: 0, sanity: -5, performance: 5 },
                        log: "你如实汇报了情况。Senior 叹了口气，让你继续扩大抽样范围。工作量增加了（SAN值下降），但你遵守了职业道德（KPI上升）。"
                    },
                    {
                        label: "多一事不如少一事，睁只眼闭只眼",
                        effect: { health: 0, sanity: 5, performance: -20 },
                        log: "你假装没看见，通过了测试。心里虽然轻松了，但这埋下了一颗不知何时会爆炸的雷（KPI大幅下降）。"
                    }
                ]
            },
            {
                id: 3,
                text: "【盘点苦差】项目经理在群里问：“谁愿意去那个位于偏远山区的养猪场盘点？路途遥远，环境极其恶劣，但有额外差补。”",
                choices: [
                    {
                        label: "主动请缨",
                        effect: { health: -20, sanity: -10, performance: 15 },
                        log: "你举手去了。在猪圈里数了一天猪，浑身恶臭，累得半死，但赢得了经理的赏识（KPI大幅上升）。"
                    },
                    {
                        label: "保持沉默",
                        effect: { health: 0, sanity: 0, performance: -5 },
                        log: "你低头看电脑，假装没看到消息。最后另一个倒霉蛋去了，经理对你毫无印象（KPI微降）。"
                    }
                ]
            }
        ];

        // --- UI Elements ---
        const logElement = document.getElementById('game-log');
        const controlsElement = document.getElementById('controls');
        const yearDisplay = document.getElementById('year-display');
        const quarterDisplay = document.getElementById('quarter-display');
        const levelDisplay = document.getElementById('level-display');
        const hpVal = document.getElementById('hp-val');
        const sanVal = document.getElementById('san-val');
        const kpiVal = document.getElementById('kpi-val');

        // --- Core Functions ---

        /**
         * Appends a line of text to the game log.
         * @param {string} text - The text to display.
         */
        function printLog(text) {
            const p = document.createElement('p');
            p.textContent = text;
            logElement.appendChild(p);
            // Auto-scroll to bottom
            logElement.scrollTop = logElement.scrollHeight;
        }

        /**
         * Updates the status bar with current game state.
         */
        function updateUI() {
            yearDisplay.textContent = `Year ${gameState.year}`;
            quarterDisplay.textContent = `Q${gameState.quarter}/4`;
            levelDisplay.textContent = CAREER_LADDER[gameState.levelIndex];
            hpVal.textContent = gameState.stats.health;
            sanVal.textContent = gameState.stats.sanity;
            kpiVal.textContent = gameState.stats.performance;
        }

        /**
         * Renders action buttons.
         * @param {Array<{label: string, action: Function}>} options
         */
        function renderButtons(options) {
            controlsElement.innerHTML = ''; // Clear existing buttons
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.textContent = opt.label;
                btn.onclick = () => {
                    opt.action();
                };
                controlsElement.appendChild(btn);
            });
        }

        /**
         * Checks if the game is over based on stats.
         * @returns {boolean} True if game is over.
         */
        function checkGameOver() {
            let gameOver = false;
            let message = "";

            if (gameState.stats.health <= 0) {
                message = "!!! 你因过劳晕倒在工位上，被救护车拉走。游戏结束。";
                gameOver = true;
            } else if (gameState.stats.sanity <= 0) {
                message = "!!! 你精神崩溃了，在办公室大哭一场后递交了辞呈。游戏结束。";
                gameOver = true;
            }

            if (gameOver) {
                printLog(message);
                renderButtons([{
                    label: "重新开始",
                    action: () => location.reload()
                }]);
                return true;
            }
            return false;
        }

        // --- Event Logic ---

        /**
         * Triggers a random event from the gameEvents array.
         */
        function triggerEvent() {
            // Randomly select an event
            const randomIndex = Math.floor(Math.random() * gameEvents.length);
            const event = gameEvents[randomIndex];

            printLog("----------------------------------------");
            printLog(`[Q${gameState.quarter} 随机事件] ${event.text}`);

            // Map choices to button format
            const buttonOptions = event.choices.map(choice => {
                return {
                    label: choice.label,
                    action: () => handleChoice(choice)
                };
            });

            renderButtons(buttonOptions);
        }

        /**
         * Handles the player's choice.
         * @param {Object} choice - The choice object selected.
         */
        function handleChoice(choice) {
            // 1. Update stats
            if (choice.effect.health) gameState.stats.health += choice.effect.health;
            if (choice.effect.sanity) gameState.stats.sanity += choice.effect.sanity;
            if (choice.effect.performance) gameState.stats.performance += choice.effect.performance;

            // 2. Refresh UI immediately
            updateUI();

            // 3. Log the result
            printLog(`> ${choice.log}`);

            // Show stat changes
            let statsLog = [];
            if (choice.effect.health) statsLog.push(`HP ${choice.effect.health > 0 ? '+' : ''}${choice.effect.health}`);
            if (choice.effect.sanity) statsLog.push(`SAN ${choice.effect.sanity > 0 ? '+' : ''}${choice.effect.sanity}`);
            if (choice.effect.performance) statsLog.push(`KPI ${choice.effect.performance > 0 ? '+' : ''}${choice.effect.performance}`);
            if (statsLog.length > 0) printLog(`(${statsLog.join(', ')})`);

            // 4. Check for Game Over (Health/Sanity)
            if (checkGameOver()) return;

            // 5. Determine next step (Next Quarter or End of Year)
            if (gameState.quarter < 4) {
                renderButtons([
                    {
                        label: "进入下一季度",
                        action: nextQuarter
                    }
                ]);
            } else {
                 renderButtons([
                    {
                        label: "年终总结与评估",
                        action: endYearAssessment
                    }
                ]);
            }
        }

        function nextQuarter() {
            gameState.quarter++;
            updateUI();
            triggerEvent();
        }

        /**
         * Handles the End of Year Assessment logic.
         */
        function endYearAssessment() {
            printLog("========================================");
            printLog(`【Year ${gameState.year} 年终评估】`);
            printLog("HR 和合伙人正在审阅你这一年的表现...");

            // Delay slightly for effect (optional, simulated by text here)

            // 1. Check Win Condition
            // (Only if we reached Partner, but we usually promote TO partner at the end of the year)
            // Logic: Check current level or check if promotion leads to Partner.
            // Let's process promotion first.

            let performance = gameState.stats.performance;
            let promoted = false;
            let gameOver = false;

            if (performance < 40) {
                // Termination
                printLog(`!!! 你的绩效评分仅为 ${performance} (低于40)。`);
                printLog("合伙人面色凝重地通知你：由于绩效不达标，你被列入 PIP (绩效改进计划)，并最终被劝退。");
                printLog("游戏结束。");
                gameOver = true;
                renderButtons([{ label: "重新开始", action: () => location.reload() }]);
                return;
            } else if (performance > 80) {
                // Promotion
                if (gameState.levelIndex < CAREER_LADDER.length - 1) {
                    gameState.levelIndex++;
                    promoted = true;
                    printLog(`*** 恭喜！你的绩效评分高达 ${performance}！`);
                    printLog(`你成功晋升为：${CAREER_LADDER[gameState.levelIndex]}！`);
                } else {
                    // Already Partner? This shouldn't happen usually unless infinite mode.
                    printLog(`你已经是 ${CAREER_LADDER[gameState.levelIndex]}，独孤求败。`);
                }
            } else {
                // Stay
                printLog(`你的绩效评分为 ${performance}。表现尚可，但未达到晋升标准。`);
                printLog(`你将继续保持当前职级：${CAREER_LADDER[gameState.levelIndex]}。`);
            }

            // Check Win Condition (Partner)
            if (gameState.levelIndex >= CAREER_LADDER.length - 1) {
                printLog("****************************************");
                printLog("恭喜你！你已经攀登到了职业生涯的顶峰——合伙人 (Partner)！");
                printLog("你不仅生存了下来，还成为了规则的制定者。");
                printLog("VICTORY - 游戏通关！");
                printLog("****************************************");
                renderButtons([{ label: "重新开始", action: () => location.reload() }]);
                return;
            }

            // Reset for New Year
            gameState.year++;
            gameState.quarter = 1;
            gameState.stats.performance = 50; // Reset KPI

            // Health/Sanity recovery
            let healthRecovery = 20;
            let sanityRecovery = 20;

            let oldHealth = gameState.stats.health;
            gameState.stats.health = Math.min(100, gameState.stats.health + healthRecovery);
            let healthGain = gameState.stats.health - oldHealth;

            let oldSanity = gameState.stats.sanity;
            gameState.stats.sanity = Math.min(100, gameState.stats.sanity + sanityRecovery);
            let sanityGain = gameState.stats.sanity - oldSanity;

            printLog("----------------------------------------");
            printLog(`新的一年开始了 (Year ${gameState.year})。`);
            printLog(`经过假期的休整，体力 +${healthGain}，SAN值 +${sanityGain}。`);
            printLog("绩效评分已重置为 50。准备迎接新的挑战吧。");

            updateUI();

            renderButtons([
                {
                    label: `开始 Year ${gameState.year}`,
                    action: triggerEvent
                }
            ]);
        }

        // --- Initial Game Loop ---

        function initGame() {
            printLog("欢迎来到四大事务所模拟器。");
            printLog("你是新入职的审计员 (Audit Associate 1)。");
            printLog("忙季即将开始，请准备好迎接挑战。");

            updateUI();

            renderButtons([
                {
                    label: "开始工作",
                    action: triggerEvent
                }
            ]);
        }

        // Start the game
        initGame();

    </script>
</body>
</html>
