<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Big 4 Survival: Terminal Edition</title>
    <style>
        /* --- 1. Global Reset & Typography --- */
        :root {
            --bg-color: #0a0a0a;
            --text-color: #e0e0e0;
            --accent-green: #00ff41; /* Matrix Green */
            --accent-red: #ff3333;
            --accent-blue: #00ccff; /* Cyber Blue */
            --accent-gold: #ffd700;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --font-mono: "Fira Code", "Courier New", Courier, monospace;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-mono);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 14px;
        }

        /* --- 2. Login Overlay --- */
        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        #login-box {
            background: var(--glass-bg);
            border: 1px solid var(--accent-green);
            padding: 40px;
            border-radius: 4px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
        }

        #login-title {
            color: var(--accent-green);
            font-size: 24px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #username-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--text-color);
            color: var(--text-color);
            font-family: var(--font-mono);
            font-size: 18px;
            padding: 10px;
            outline: none;
            width: 200px;
            text-align: center;
            margin-bottom: 30px;
        }

        #username-input:focus {
            border-bottom-color: var(--accent-green);
        }

        #start-btn {
            background: var(--accent-green);
            color: #000;
            border: none;
            padding: 12px 30px;
            font-family: var(--font-mono);
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        #start-btn:hover {
            box-shadow: 0 0 15px var(--accent-green);
            transform: scale(1.05);
        }

        /* --- 3. Dashboard / HUD --- */
        #hud {
            padding: 15px;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid var(--glass-border);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            z-index: 10;
        }

        .hud-info {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
            border-bottom: 1px solid #222;
            padding-bottom: 5px;
        }

        .stat-bar-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat-label {
            font-size: 10px;
            display: flex;
            justify-content: space-between;
            text-transform: uppercase;
        }

        .progress-track {
            height: 6px;
            background: #222;
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 50%;
            background: var(--text-color);
            transition: width 0.5s ease-out, background-color 0.3s;
        }

        /* Dynamic Colors for Stats */
        .fill-green { background: var(--accent-green); }
        .fill-red { background: var(--accent-red); }
        .fill-blue { background: var(--accent-blue); }
        .fill-gold { background: var(--accent-gold); }

        /* --- 4. Main Terminal (Log) --- */
        #terminal {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.6;
            color: #ccc;
            scroll-behavior: smooth;
        }

        .log-entry {
            margin-bottom: 20px;
            padding-left: 10px;
            border-left: 2px solid var(--glass-border);
            animation: fadeIn 0.3s ease-out;
        }

        .log-entry.system {
            border-left-color: var(--accent-blue);
            color: var(--accent-blue);
            font-size: 12px;
        }

        .log-entry.event {
            border-left-color: var(--text-color);
        }

        .log-entry.warning {
            border-left-color: var(--accent-red);
            color: var(--accent-red);
        }

        .log-entry.success {
            border-left-color: var(--accent-green);
            color: var(--accent-green);
        }

        /* Typing Cursor */
        .cursor::after {
            content: '▋';
            animation: blink 1s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-5px); } to { opacity: 1; transform: translateX(0); } }

        /* --- 5. Controls (Glassmorphism) --- */
        #controls {
            padding: 20px;
            background: rgba(0, 0, 0, 0.9);
            border-top: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 150px; /* Reserve space */
            justify-content: center;
        }

        .control-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(5px);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 15px;
            font-family: var(--font-mono);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .control-btn:hover {
            border-color: var(--accent-green);
            background: rgba(0, 255, 65, 0.05);
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.1);
        }

        .control-btn:active {
            transform: scale(0.98);
        }

        .control-btn::before {
            content: "> ";
            color: var(--accent-green);
            opacity: 0.5;
        }

        /* --- 6. End Year Report Overlay --- */
        #report-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 900;
            display: none; /* Hidden by default */
            flex-direction: column;
            padding: 40px;
            overflow-y: auto;
        }

        .report-header {
            font-size: 20px;
            color: var(--accent-green);
            border-bottom: 2px solid var(--accent-green);
            margin-bottom: 30px;
            padding-bottom: 10px;
            text-transform: uppercase;
        }

        .report-section {
            margin-bottom: 30px;
        }

        .report-label {
            color: #666;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .report-value {
            font-size: 24px;
            color: #fff;
        }

        .val-gain { color: var(--accent-green); }
        .val-loss { color: var(--accent-red); }

    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen">
        <div id="login-box">
            <div id="login-title">SYSTEM LOGIN</div>
            <input type="text" id="username-input" placeholder="ENTER ID / ALIAS" maxlength="12" autocomplete="off">
            <br>
            <button id="start-btn">INITIALIZE</button>
        </div>
    </div>

    <!-- Year End Report Screen -->
    <div id="report-screen">
        <div class="report-header">PERFORMANCE REVIEW (Q4)</div>
        <div id="report-content"></div>
        <button class="control-btn" id="report-close-btn" style="margin-top:auto; text-align:center;">ACKNOWLEDGE</button>
    </div>

    <!-- HUD -->
    <header id="hud">
        <div class="hud-info">
            <span id="user-display">USER: GUEST</span>
            <span id="time-display">Y1 Q1</span>
            <span id="role-display">A1</span>
        </div>

        <!-- Health (精力) -->
        <div class="stat-bar-container">
            <div class="stat-label"><span>HEALTH</span><span id="health-val">100</span></div>
            <div class="progress-track">
                <div class="progress-fill fill-red" id="health-bar" style="width: 100%;"></div>
            </div>
        </div>

        <!-- Wealth (财富) -->
        <div class="stat-bar-container">
            <div class="stat-label"><span>WEALTH</span><span id="wealth-val">1000</span></div>
            <div class="progress-track">
                <div class="progress-fill fill-gold" id="wealth-bar" style="width: 10%;"></div> <!-- Wealth is unbounded, verify width logic -->
            </div>
        </div>

        <!-- Sanity (压力/精神) -->
        <div class="stat-bar-container">
            <div class="stat-label"><span>SANITY</span><span id="sanity-val">100</span></div>
            <div class="progress-track">
                <div class="progress-fill fill-blue" id="sanity-bar" style="width: 100%;"></div>
            </div>
        </div>

        <!-- Connection (人脉) -->
        <div class="stat-bar-container">
            <div class="stat-label"><span>CONNECTION</span><span id="conn-val">0</span></div>
            <div class="progress-track">
                <div class="progress-fill fill-green" id="conn-bar" style="width: 0%;"></div>
            </div>
        </div>
    </header>

    <!-- Terminal -->
    <main id="terminal">
        <!-- Logs go here -->
    </main>

    <!-- Controls -->
    <footer id="controls">
        <!-- Buttons injected here -->
    </footer>

    <script>
        // --- CONSTANTS ---
        const CAREER_LADDER = ['A1', 'A2', 'S1', 'S2', 'S3', 'M1', 'M2', 'SM', 'Par'];

        // Base Salary per Quarter (Wealth)
        const SALARY_TABLE = [
            500,  // A1
            600,  // A2
            800,  // S1
            900,  // S2
            1000, // S3
            1500, // M1
            1800, // M2
            2500, // SM
            5000  // Par
        ];

        // --- STATE ---
        const gameState = {
            name: "GUEST",
            year: 1,
            quarter: 1,
            levelIndex: 0,
            stats: {
                health: 100,
                wealth: 1000,
                sanity: 100,
                connection: 0,
                performance: 50 // Hidden KPI, resets yearly
            },
            wealthStartOfYear: 1000,
            history: [] // Log achievements
        };

        // --- EVENTS (Expanded for Quad-Metrics) ---
        // Added 'wealth' and 'connection' impacts to existing data.
        const gameEvents = [
            {
                id: 1, min: 0, max: 1,
                text: "Manager 让你去打印室装订 50 本报告，墨粉洒了一地。",
                choices: [
                    { label: "自己动手修", effect: { h: -5, s: -5, w: 0, c: 0, p: 2 }, log: "修好了，但衬衫毁了(-Wealth for cleaning?)。Manager 夸你 Handy。" },
                    { label: "找 Admin 姐姐帮忙", effect: { h: 0, s: 5, w: -50, c: 2, p: 0 }, log: "请 Admin 喝了杯豪华奶茶(Wealth -50)，建立了良好的行政关系。" }
                ]
            },
            {
                id: 2, min: 0, max: 2,
                text: "深夜 2 点，Senior 让你别填加班费(OT)以保项目预算。",
                choices: [
                    { label: "老实听话 (No OT)", effect: { h: 0, s: -10, w: -200, c: 5, p: 5 }, log: "牺牲了加班费(Wealth -200 equivalent)，但 Senior 觉得你懂事。" },
                    { label: "据实申报", effect: { h: 0, s: 5, w: 200, c: -5, p: -10 }, log: "拿到了加班费(Wealth +200)，但被 Manager 标记为'不懂事'。" }
                ]
            },
            {
                id: 3, min: 1, max: 3,
                text: "去偏远山区做煤炭盘点。零下 10 度，全是煤灰。",
                choices: [
                    { label: "爬煤堆精准盘点", effect: { h: -15, s: -5, w: 0, c: 5, p: 10 }, log: "吸入两斤粉尘，盘点无差异。客户厂长敬你白酒(Health -15)。" },
                    { label: "抽样看看", effect: { h: -2, s: 5, w: 0, c: 0, p: -5 }, log: "早早回酒店躺着，心里忐忑不安。" }
                ]
            },
            {
                id: 4, min: 2, max: 4,
                text: "客户财务总监(FC)摔了文件夹，嫌你 PBC List 太多。",
                choices: [
                    { label: "卑微道歉", effect: { h: 0, s: -15, w: 0, c: 0, p: 5 }, log: "自尊受挫(Sanity -15)，但拿到了资料。" },
                    { label: "据理力争", effect: { h: 0, s: 10, w: 0, c: -10, p: -10 }, log: "FC 投诉你态度恶劣，Review Note +1。" }
                ]
            },
            {
                id: 5, min: 3, max: 5,
                text: "猎头介绍大厂战略岗，薪资涨幅 50%，但这周要面试。",
                choices: [
                    { label: "请病假面试", effect: { h: 5, s: 20, w: -100, c: 0, p: -15 }, log: "面试顺利(Sanity +20)，但扣了全勤奖(Wealth -100)且耽误了进度。" },
                    { label: "拒绝诱惑", effect: { h: -5, s: -10, w: 0, c: 5, p: 10 }, log: "你挂了电话继续调表。合伙人梦+1。" }
                ]
            },
            {
                id: 6, min: 4, max: 6,
                text: "你带的小朋友(A1)崩溃大哭要离职，底稿一团糟。",
                choices: [
                    { label: "温柔安抚帮他做", effect: { h: -20, s: -5, w: 0, c: 10, p: 5 }, log: "你自己通宵填坑(Health -20)，小朋友把你当再生父母(Connection +10)。" },
                    { label: "严厉批评", effect: { h: 0, s: 5, w: 0, c: -5, p: -5 }, log: "小朋友旷工了，烂摊子还是你的，且名声变差。" }
                ]
            },
            {
                id: 7, min: 5, max: 8,
                text: "合伙人让你去 BD 大客户，对方暗示要回扣。",
                choices: [
                    { label: "严词拒绝", effect: { h: 0, s: 5, w: 0, c: 0, p: 0 }, log: "单子丢了。合伙人脸色难看，但你守住了底线。" },
                    { label: "坚守合规", effect: { h: 0, s: 10, w: 0, c: 5, p: 5 }, log: "你用专业折服了客户(Connection +5)，虽然没给回扣也签了。" }
                ]
            },
            // New "Hardcore" events
            {
                id: 101, min: 0, max: 8,
                text: "实在太累了，看着窗外的暴雨，你犹豫要不要打豪华专车回家。",
                choices: [
                    { label: "打专车 (Wealth -50)", effect: { h: 5, s: 5, w: -50, c: 0, p: 0 }, log: "你在后座睡了一觉，稍微回了点血。" },
                    { label: "挤地铁", effect: { h: -5, s: -5, w: 0, c: 0, p: 0 }, log: "被挤成了沙丁鱼，身心俱疲。" }
                ]
            },
            {
                id: 102, min: 0, max: 8,
                text: "为了维护组内关系，大家提议去吃顿好的。",
                choices: [
                    { label: "请客 (Wealth -200)", effect: { h: 0, s: 5, w: -200, c: 15, p: 0 }, log: "大家欢呼雀跃，你在组里的人缘变好了(Connection +15)。" },
                    { label: "AA制", effect: { h: 0, s: 0, w: -50, c: 2, p: 0 }, log: "平平淡淡的一顿饭。" }
                ]
            },
            {
                id: 103, min: 0, max: 8,
                text: "年会到了，你需要上台表演。",
                choices: [
                    { label: "穿女装跳舞", effect: { h: -5, s: -10, w: 100, c: 20, p: 5 }, log: "Par 给你发了红包(Wealth +100)，全所都认识你了(Connection +20)！" },
                    { label: "装病", effect: { h: 5, s: 5, w: 0, c: -10, p: -5 }, log: "大家觉得你不合群(Connection -10)。" }
                ]
            }
        ];

        // --- DOM ELEMENTS ---
        const els = {
            login: document.getElementById('login-screen'),
            userInput: document.getElementById('username-input'),
            startBtn: document.getElementById('start-btn'),
            hud: {
                user: document.getElementById('user-display'),
                time: document.getElementById('time-display'),
                role: document.getElementById('role-display'),
                hVal: document.getElementById('health-val'),
                hBar: document.getElementById('health-bar'),
                wVal: document.getElementById('wealth-val'),
                wBar: document.getElementById('wealth-bar'),
                sVal: document.getElementById('sanity-val'),
                sBar: document.getElementById('sanity-bar'),
                cVal: document.getElementById('conn-val'),
                cBar: document.getElementById('conn-bar')
            },
            terminal: document.getElementById('terminal'),
            controls: document.getElementById('controls'),
            report: {
                screen: document.getElementById('report-screen'),
                content: document.getElementById('report-content'),
                btn: document.getElementById('report-close-btn')
            }
        };

        // --- INITIALIZATION ---
        els.startBtn.addEventListener('click', () => {
            const name = els.userInput.value.trim() || "AUDITOR";
            gameState.name = name;
            els.login.style.display = 'none';
            initGame();
        });

        els.report.btn.addEventListener('click', () => {
            els.report.screen.style.display = 'none';
            // Start next year
            gameState.year++;
            gameState.quarter = 1;
            gameState.stats.performance = 50; // Reset KPI
            gameState.wealthStartOfYear = gameState.stats.wealth; // Track start wealth
            // Recover stats
            changeStat('health', 20);
            changeStat('sanity', 20);

            typewriter(`\n>>> SYSTEM REBOOT... YEAR ${gameState.year} INITIALIZED.`, 'system');
            updateHUD();
            triggerEvent();
        });

        function initGame() {
            gameState.wealthStartOfYear = gameState.stats.wealth;
            updateHUD();
            typewriter(`>>> WELCOME, ${gameState.name}. SYSTEM ONLINE.`, 'system');
            typewriter(`>>> TARGET: SURVIVE & ADVANCE TO PARTNER.`, 'system');
            setTimeout(triggerEvent, 1000);
        }

        // --- CORE LOGIC ---

        function changeStat(key, delta) {
            gameState.stats[key] += delta;

            // Bounds
            if (key === 'health') gameState.stats[key] = Math.min(100, Math.max(0, gameState.stats[key]));
            if (key === 'sanity') gameState.stats[key] = Math.min(100, Math.max(0, gameState.stats[key]));
            if (key === 'connection') gameState.stats[key] = Math.min(100, Math.max(0, gameState.stats[key]));
            if (key === 'performance') gameState.stats[key] = Math.min(100, Math.max(0, gameState.stats[key]));
            // Wealth is unbounded
        }

        function updateHUD() {
            els.hud.user.textContent = gameState.name;
            els.hud.time.textContent = `Y${gameState.year} Q${gameState.quarter}`;
            els.hud.role.textContent = CAREER_LADDER[gameState.levelIndex];

            // Update Values
            els.hud.hVal.textContent = gameState.stats.health;
            els.hud.wVal.textContent = gameState.stats.wealth;
            els.hud.sVal.textContent = gameState.stats.sanity;
            els.hud.cVal.textContent = gameState.stats.connection;

            // Update Bars
            setBar(els.hud.hBar, gameState.stats.health, 100);
            setBar(els.hud.wBar, gameState.stats.wealth, 5000); // Scale wealth relative to 5000 for visual
            setBar(els.hud.sBar, gameState.stats.sanity, 100);
            setBar(els.hud.cBar, gameState.stats.connection, 100);
        }

        function setBar(el, val, max) {
            const pct = Math.min(100, Math.max(0, (val / max) * 100));
            el.style.width = `${pct}%`;

            // Color Logic
            el.className = 'progress-fill'; // Reset
            if (pct < 30) el.classList.add('fill-red');
            else if (pct > 70) el.classList.add('fill-green');
            else el.classList.add('fill-blue');

            // Wealth override
            if (el === els.hud.wBar) {
                 el.className = 'progress-fill fill-gold';
            }
        }

        function typewriter(text, type = 'event', callback) {
            const p = document.createElement('div');
            p.className = `log-entry ${type} cursor`;
            els.terminal.appendChild(p);

            let i = 0;
            const speed = 15; // ms per char

            function typeChar() {
                if (i < text.length) {
                    p.textContent += text.charAt(i);
                    i++;
                    els.terminal.scrollTop = els.terminal.scrollHeight;
                    setTimeout(typeChar, speed);
                } else {
                    p.classList.remove('cursor');
                    if (callback) callback();
                }
            }
            typeChar();
        }

        function checkGameOver() {
            if (gameState.stats.health <= 0) return "DIAGNOSIS: CRITICAL ORGAN FAILURE. CAREER TERMINATED.";
            if (gameState.stats.sanity <= 0) return "DIAGNOSIS: PSYCHOTIC BREAK. REMOVED BY SECURITY.";
            if (gameState.stats.wealth < -500) return "STATUS: BANKRUPT. DEBT COLLECTORS INTERVENED.";
            return null;
        }

        function triggerEvent() {
            // Check Quarter Loop
            if (gameState.quarter > 4) {
                showYearEndReport();
                return;
            }

            // Distribute Salary
            const salary = SALARY_TABLE[gameState.levelIndex];
            changeStat('wealth', salary);
            updateHUD();
            typewriter(`[SYSTEM] Q${gameState.quarter} SALARY DISBURSED: +$${salary}`, 'system');

            // Filter Events
            const validEvents = gameEvents.filter(e =>
                gameState.levelIndex >= e.min && gameState.levelIndex <= e.max
            );

            const event = validEvents[Math.floor(Math.random() * validEvents.length)] || validEvents[0];

            setTimeout(() => {
                typewriter(`>> EVENT [${event.id}]: ${event.text}`, 'event', () => {
                    renderChoices(event.choices);
                });
            }, 500);
        }

        function renderChoices(choices) {
            els.controls.innerHTML = '';

            // Sanity Chaos Check
            const isCrazy = gameState.stats.sanity < 20;
            if (isCrazy) {
                typewriter("Warning: Mental Stability Critical. Decisions may be erratic...", "warning");
            }

            choices.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'control-btn';
                btn.textContent = c.label;
                btn.onclick = () => {
                    els.controls.innerHTML = '';

                    // Chaos Logic: 50% chance to pick random effect
                    let finalChoice = c;
                    if (isCrazy && Math.random() < 0.5) {
                        finalChoice = choices[Math.floor(Math.random() * choices.length)];
                        typewriter("!!! MENTAL HAZE: You acted irrationally!", "warning");
                    }

                    handleChoice(finalChoice);
                };
                els.controls.appendChild(btn);
            });
        }

        function handleChoice(c) {
            // Apply Effects
            changeStat('health', c.effect.h);
            changeStat('sanity', c.effect.s);
            changeStat('wealth', c.effect.w);
            changeStat('connection', c.effect.c);
            changeStat('performance', c.effect.p);

            updateHUD();

            typewriter(`> ${c.log}`);

            // Log changes
            let diff = [];
            if(c.effect.h) diff.push(`HLT ${c.effect.h}`);
            if(c.effect.s) diff.push(`SAN ${c.effect.s}`);
            if(c.effect.w) diff.push(`$$$ ${c.effect.w}`);
            if(c.effect.c) diff.push(`CON ${c.effect.c}`);
            if(diff.length) typewriter(`[EFFECT] ${diff.join(' | ')}`, 'system');

            // Check Game Over
            const deathMsg = checkGameOver();
            if (deathMsg) {
                typewriter(deathMsg, 'warning');
                const btn = document.createElement('button');
                btn.className = 'control-btn';
                btn.textContent = "SYSTEM RESTART";
                btn.onclick = () => location.reload();
                els.controls.appendChild(btn);
                return;
            }

            // Next
            setTimeout(() => {
                const btn = document.createElement('button');
                btn.className = 'control-btn';
                btn.textContent = "PROCEED TO NEXT QUARTER";
                btn.onclick = () => {
                    els.controls.innerHTML = '';
                    gameState.quarter++;
                    triggerEvent();
                };
                els.controls.appendChild(btn);
            }, 1000);
        }

        function showYearEndReport() {
            // Generate Report
            const p = gameState.stats.performance;
            let result = "";
            let promoted = false;

            if (p < 40) {
                result = "TERMINATED (PIP)";
            } else if (p > 80) {
                // Connection Check for Partner
                const isPartnerTry = gameState.levelIndex === CAREER_LADDER.length - 2; // SM -> Par
                if (isPartnerTry && gameState.stats.connection < 80) {
                    result = "PROMOTION REJECTED (INSUFFICIENT CONNECTION)";
                } else {
                    if (gameState.levelIndex < CAREER_LADDER.length - 1) {
                        gameState.levelIndex++;
                        promoted = true;
                        result = `PROMOTED TO ${CAREER_LADDER[gameState.levelIndex]}`;
                    } else {
                        result = "ALREADY AT SUMMIT";
                    }
                }
            } else {
                result = "RETAINED IN CURRENT GRADE";
            }

            if (result.includes("TERMINATED")) {
                 typewriter("CAREER TERMINATED DURING REVIEW. GAME OVER.", 'warning');
                 const btn = document.createElement('button');
                 btn.className = 'control-btn';
                 btn.textContent = "SYSTEM RESTART";
                 btn.onclick = () => location.reload();
                 els.controls.innerHTML = '';
                 els.controls.appendChild(btn);
                 return;
            }

            // Win Check
            if (gameState.levelIndex === CAREER_LADDER.length - 1) {
                 typewriter("MISSION ACCOMPLISHED: PARTNER STATUS ACHIEVED.", 'success');
                 typewriter("YOU HAVE WON THE GAME OF SURVIVAL.", 'success');
                 const btn = document.createElement('button');
                 btn.className = 'control-btn';
                 btn.textContent = "SYSTEM RESTART";
                 btn.onclick = () => location.reload();
                 els.controls.innerHTML = '';
                 els.controls.appendChild(btn);
                 return;
            }

            const wealthChange = gameState.stats.wealth - gameState.wealthStartOfYear;
            const sign = wealthChange >= 0 ? '+' : '';
            const wealthClass = wealthChange >= 0 ? 'val-gain' : 'val-loss';

            els.report.content.innerHTML = `
                <div class="report-section">
                    <div class="report-label">ANNUAL PERFORMANCE (KPI)</div>
                    <div class="report-value ${p > 80 ? 'val-gain' : 'val-loss'}">${p} / 100</div>
                </div>
                <div class="report-section">
                    <div class="report-label">ANNUAL FINANCIAL INCREMENT</div>
                    <div class="report-value ${wealthClass}">${sign}$${wealthChange}</div>
                </div>
                <div class="report-section">
                    <div class="report-label">DECISION</div>
                    <div class="report-value" style="color:#fff; border:1px solid #fff; padding:10px;">${result}</div>
                </div>
            `;

            els.report.screen.style.display = 'flex';
        }

    </script>
</body>
</html>
